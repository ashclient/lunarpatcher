name: Build and publish LunarPatcher for Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lunarpatcher-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Go tests
        shell: pwsh
        run: |
          Set-Location engine
          go test ./...
      - name: Build patch engine
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/bin | Out-Null
          Set-Location engine
          go build -trimpath -ldflags="-s -w" -o ../build/bin/LunarPatcherEngine.exe .
      - name: Install Electron dependencies
        run: npm install --no-audit --no-fund
      - name: Check UI and in-app updater
        run: npm run test:smoke
      - name: Install Chromium for UI smoke tests
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install chromium
      - name: Smoke-test Electron renderer states
        run: python tests/ui_smoke.py
      - name: Package Windows desktop application
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win
      - name: Check release package
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $expected = "dist/LunarPatcher_Setup_$version.exe"
          if (!(Test-Path $expected)) { throw "Missing $expected" }
          if (!(Test-Path 'dist/latest.yml')) { throw 'Updater metadata latest.yml missing' }
          Get-FileHash -Algorithm SHA256 $expected | Format-List
      - name: Publish GitHub release if version is new
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $repo = $env:GITHUB_REPOSITORY
          $null = gh release view $tag --repo $repo 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Existing release $tag; skipping. Bump package.json version for a new release."
            exit 0
          }
          $notes = "LunarPatcher $version: fix Roblox React #137 crash and expand Roblox Hub Home, Discover, Library, game details, Friends, Avatar, Marketplace, Accounts, Settings. Authenticated actions remain on Roblox.com. Existing clean layout, themes and updater preserved. Unsigned community build; SmartScreen may warn."
          $assets = @(Get-ChildItem -Path dist -File | Where-Object { $_.Name -match '^LunarPatcher_Setup_.*\.exe(\.blockmap)?$' -or $_.Name -eq 'latest.yml' } | ForEach-Object { $_.FullName })
          if (-not ($assets | Where-Object { $_ -like '*.exe' })) { throw 'No setup executable found for release' }
          if (-not ($assets | Where-Object { $_ -like '*latest.yml' })) { throw 'Missing latest.yml for the updater' }
          gh release create $tag @assets --target $env:GITHUB_SHA --title "LunarPatcher $tag" --notes $notes --repo $repo
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed' }
