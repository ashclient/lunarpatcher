name: Build and publish LunarPatcher for Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lunarpatcher-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Go tests
        shell: pwsh
        run: |
          Set-Location engine
          go test ./...
      - name: Build patch engine
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/bin | Out-Null
          Set-Location engine
          go build -trimpath -ldflags="-s -w" -o ../build/bin/LunarPatcherEngine.exe .
      - name: Install Electron dependencies
        run: npm install --no-audit --no-fund
      - name: Check UI JavaScript
        run: npm run test:syntax
      - name: Package Windows desktop application
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win
      - name: Check release package
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $expected = "dist/LunarPatcher_Setup_$version.exe"
          if (!(Test-Path $expected)) { throw "Missing $expected" }
          if (!(Test-Path 'dist/latest.yml')) { throw 'Updater metadata latest.yml missing' }
          Get-FileHash -Algorithm SHA256 $expected | Format-List
      - name: Upload Windows installer as downloadable Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: LunarPatcher-Windows-v1.2.2
          path: |
            dist/LunarPatcher_Setup_*.exe
            dist/LunarPatcher_Setup_*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub release if version is new
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $repo = $env:GITHUB_REPOSITORY
          $null = gh release view $tag --repo $repo 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Existing release $tag; skipping. Bump package.json version for a new release."
            exit 0
          }
          $notes = "LunarPatcher 1.2.2: moves native Latest News strictly to the Updates tab instead of stacking it under Launch, fixes the two-column Launchpad grid and expanded friends-panel sizing, refines Sakura wallpaper and rose UI styling, preserves original launch toolbar and shortcuts. Includes verified backup/restore and GitHub auto-update. Unsigned community build; Windows SmartScreen may warn."
          $assets = @(Get-ChildItem -Path dist -File | Where-Object { $_.Name -match '^LunarPatcher_Setup_.*\.exe(\.blockmap)?$' -or $_.Name -eq 'latest.yml' } | ForEach-Object { $_.FullName })
          if (-not ($assets | Where-Object { $_ -like '*.exe' })) { throw 'No setup executable found for release' }
          if (-not ($assets | Where-Object { $_ -like '*latest.yml' })) { throw 'Missing latest.yml for the updater' }
          gh release create $tag @assets --target $env:GITHUB_SHA --title "LunarPatcher $tag" --notes $notes --repo $repo
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Release publishing is not permitted by this repository token. The signed-off build artifacts are available from the current GitHub Actions run under LunarPatcher-Windows-v1.2.2."
            exit 0
          }
