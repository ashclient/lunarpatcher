name: Build checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test patch engine
        run: cd engine; go test ./...
      - name: Validate Electron code
        run: npm run test:syntax
      - name: Build helper executable
        run: cd engine; go build -trimpath -ldflags="-s -w" -o ../build/bin/LunarPatcherEngine.exe .
